<style>
/* Layout: one 480px "paper" column, centered on wider screens; sections stacked with
   generous air; the cover is the only full-bleed element. Single theme (no dark
   override): the couple's chosen look is shown identically to every guest. */
:root {
  color-scheme: light;
  --bg-outer: #E2D8CB;
  --bg: #F5F0E9;
  --surface: #ECE4D9;
  --ink: #3A322A;
  --muted: #7D705F;
  --line: #E0D5C7;
  --accent: #86725D;
  --accent-soft: #E8DFD3;
  --on-accent: #FFFDF9;
  --sun: #A9574A;
  --on-photo: #FFFFFF;
  --particle: 205, 186, 160;
  --f-body: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-display: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-latin: "Cormorant Garamond", "Cormorant", "Times New Roman", serif;
  --f-script: "Cormorant Garamond", "Cormorant", "Times New Roman", serif;
  --script-style: italic;
  --latin-tracking: 0.3em;
  --col: 480px;
  --gutter: 26px;
  --radius: 14px;
  --t-xs: 0.75rem;   /* 12px  captions */
  --t-sm: 0.875rem;  /* 14px  secondary */
  --t-md: 1rem;      /* 16px  body (never smaller for running text: elders read this) */
  --t-lg: 1.25rem;   /* 20px  section titles */
  --t-xl: 1.75rem;   /* 28px  names */
  --t-2xl: 3.25rem;  /* 52px  big numerals */
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; } /* also needed when the page is hosted on its own */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg-outer);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.85;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; display: block; } /* height:auto so aspect-ratio wins over the height attribute */
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.inv {
  position: relative;
  max-width: var(--col);
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  overflow: hidden;
}

/* ---------- shared pieces ---------- */
.sec { padding: 76px var(--gutter); text-align: center; position: relative; }
.sec + .sec::before {
  content: ""; position: absolute; top: 0; left: 50%;
  width: 1px; height: 36px; background: var(--line); transform: translateX(-50%);
}
.eyebrow {
  margin: 0 0 6px;
  font-family: var(--f-latin);
  font-size: var(--t-xs);
  letter-spacing: var(--latin-tracking);
  text-transform: uppercase;
  color: var(--accent);
}
.sec-title {
  margin: 0 0 28px;
  font-family: var(--f-display);
  font-size: var(--t-lg);
  font-weight: 700;
  line-height: 1.5;
  text-wrap: balance;
}
.prose { margin: 0; white-space: pre-line; text-wrap: pretty; }
.muted { color: var(--muted); }
.small { font-size: var(--t-sm); }
.num { font-family: var(--f-latin); font-variant-numeric: tabular-nums lining-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 18px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); color: var(--ink);
  font-size: var(--t-sm); text-decoration: none; cursor: pointer;
  transition: background .2s, border-color .2s;
}
.btn:hover { border-color: var(--accent); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small-btn { min-height: 34px; padding: 0 12px; font-size: var(--t-xs); }
.btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
.btn svg { width: 15px; height: 15px; flex: none; }

/* ---------- cover: arch ---------- */
.cover { position: relative; }
.cover-arch { padding: 56px var(--gutter) 64px; text-align: center; }
.cover-kicker {
  margin: 0 0 26px;
  font-family: var(--f-script); font-style: var(--script-style);
  font-size: 1.375rem; color: var(--accent); line-height: 1.3;
}
.arch {
  position: relative; margin: 0 auto; width: min(100%, 330px);
}
.arch::after {
  content: ""; position: absolute; inset: -9px; border: 1px solid var(--line);
  border-radius: 1000px 1000px 4px 4px; pointer-events: none;
}
.arch img {
  width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
  border-radius: 1000px 1000px 4px 4px;
}
.cover-names {
  margin: 38px 0 10px;
  font-family: var(--f-display); font-weight: 400;
  font-size: var(--t-xl); line-height: 1.3; letter-spacing: 0.04em;
  display: flex; align-items: baseline; justify-content: center; gap: 16px; flex-wrap: wrap;
}
.cover-names i {
  font-family: var(--f-latin); font-style: italic; font-size: 1.05rem;
  color: var(--muted); letter-spacing: 0;
}
.cover-when { margin: 0; font-family: var(--f-latin); letter-spacing: 0.12em; font-size: 0.95rem; }
.cover-where { margin: 2px 0 0; color: var(--muted); font-size: var(--t-sm); }

/* ---------- cover: full-bleed ---------- */
.cover-full .full-photo { position: relative; aspect-ratio: 3 / 4.2; max-height: 92vh; width: 100%; }
.cover-full img { width: 100%; height: 100%; object-fit: cover; }
.cover-full .shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%);
}
.cover-full .full-top, .cover-full .full-bottom {
  position: absolute; left: 0; right: 0; padding: 0 var(--gutter); color: var(--on-photo); text-align: center;
}
.cover-full .full-top { top: 26px; }
.cover-full .full-top p {
  margin: 0; font-family: var(--f-latin); font-size: var(--t-xs);
  letter-spacing: var(--latin-tracking); text-transform: uppercase;
}
.cover-full .full-bottom { bottom: 30px; }
.cover-full .full-date { margin: 0; font-family: var(--f-latin); font-size: var(--t-2xl); line-height: 1; letter-spacing: 0.04em; }
.cover-full .full-names { margin: 14px 0 0; font-family: var(--f-display); font-size: 1.25rem; letter-spacing: 0.08em; }
.cover-full .full-names i { font-family: var(--f-latin); font-style: italic; margin: 0 8px; opacity: .85; }
.cover-full .full-sub { padding: 30px var(--gutter) 6px; text-align: center; }
.cover-full .full-sub p { margin: 0; }

/* ---------- cover: editorial ---------- */
.cover-editorial { padding: 40px var(--gutter) 60px; }
.ed-top {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--ink); padding-bottom: 8px;
  font-family: var(--f-latin); font-size: var(--t-xs); letter-spacing: var(--latin-tracking); text-transform: uppercase;
}
.ed-date {
  margin: 22px 0 18px; font-family: var(--f-latin); font-weight: 400;
  font-size: clamp(4.5rem, 26vw, 7.5rem); line-height: .9; letter-spacing: -0.02em; text-align: left;
}
.ed-date span { color: var(--accent); font-style: italic; padding: 0 .04em; }
.ed-photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.ed-names {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin-top: 16px; font-family: var(--f-display); font-size: 1.375rem;
}
.ed-names i { font-family: var(--f-latin); font-style: italic; color: var(--muted); font-size: 1rem; }
.ed-meta { margin: 8px 0 0; text-align: left; color: var(--muted); font-size: var(--t-sm); line-height: 1.7; white-space: pre-line; }

/* ---------- greeting & parents ---------- */
.greet-body { font-size: 1.03rem; line-height: 2.05; }
.quote { margin: 0 0 40px; color: var(--muted); font-size: var(--t-sm); white-space: pre-line; }
.quote cite { display: block; margin-top: 8px; font-style: normal; font-size: var(--t-xs); }
.parents { margin: 40px auto 0; display: grid; gap: 10px; max-width: 340px; }
.parent-line { display: flex; justify-content: center; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.parent-line .pn { font-family: var(--f-display); }
.parent-line .rel { color: var(--muted); font-size: var(--t-sm); }
.parent-line strong { font-family: var(--f-display); font-size: 1.125rem; font-weight: 700; margin-left: 4px; }
.dec { font-size: .85em; color: var(--muted); margin-right: 2px; }

/* ---------- couple (groom & bride portraits) ---------- */
.couple { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.couple figure { margin: 0; }
.couple img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; background: var(--surface); }
.couple figcaption { margin-top: 16px; display: grid; gap: 2px; }
.couple .role { font-family: var(--f-latin); font-size: var(--t-xs); letter-spacing: var(--latin-tracking); text-transform: uppercase; color: var(--accent); }
.couple .who-name { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; letter-spacing: 0.06em; }
.couple .who-par { font-size: var(--t-sm); color: var(--muted); line-height: 1.6; }
.couple .who-par .dec { margin-right: 1px; }
.couple-and { margin: 26px 0 0; font-family: var(--f-latin); font-style: italic; color: var(--muted); }

/* ---------- story ---------- */
.story { list-style: none; margin: 0 auto; padding: 0; max-width: 360px; text-align: left; display: grid; gap: 26px; }
.story li { display: grid; grid-template-columns: 74px 1fr; gap: 14px; }
.story .s-date { font-family: var(--f-latin); color: var(--accent); font-size: 0.95rem; padding-top: 1px; }
.story h3 { margin: 0; font-family: var(--f-display); font-size: 1.0625rem; }
.story p { margin: 2px 0 0; color: var(--muted); font-size: var(--t-sm); white-space: pre-line; }
.story figure { grid-column: 2; margin: 6px 0 0; }
.story figure img { border-radius: 6px; aspect-ratio: 4 / 3; object-fit: cover; width: 100%; }

/* ---------- calendar ---------- */
.when-line { margin: 0; font-size: 1.0625rem; }
.when-sub { margin: 2px 0 30px; color: var(--muted); font-size: var(--t-sm); }
.cal-wrap { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 4px 14px; }
.cal-month { margin: 0 0 10px; font-family: var(--f-latin); letter-spacing: var(--latin-tracking); font-size: var(--t-sm); }
.cal { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: var(--f-latin); font-variant-numeric: tabular-nums lining-nums; }
.cal th { font-weight: 400; font-size: var(--t-xs); color: var(--muted); padding: 4px 0 8px; font-family: var(--f-body); }
.cal td { height: 40px; font-size: 0.95rem; }
.cal .sun { color: var(--sun); }
.cal .day-mark span {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
}
.countdown { display: flex; justify-content: center; gap: 10px; margin: 30px 0 0; }
.countdown div { min-width: 58px; padding: 10px 6px 8px; border-radius: 10px; background: var(--surface); }
.countdown b { display: block; font-family: var(--f-latin); font-weight: 400; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums lining-nums; }
.countdown small { display: block; font-family: var(--f-latin); font-size: 0.625rem; letter-spacing: 0.18em; color: var(--muted); margin-top: 4px; }
.dday { margin: 20px 0 0; font-size: var(--t-sm); }
.dday b { color: var(--accent); font-weight: 700; }

/* ---------- gallery ---------- */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.grid button { padding: 0; border: 0; background: var(--surface); cursor: zoom-in; aspect-ratio: 1; overflow: hidden; }
.grid img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.grid button:hover img { transform: scale(1.04); }
.grid.portrait { grid-template-columns: repeat(2, 1fr); gap: 6px; }
.grid.portrait button { aspect-ratio: 3 / 4; border-radius: 3px; }
.grid .more-hidden { display: none; }
.grid.expanded .more-hidden { display: block; }

.lb {
  position: fixed; inset: 0; z-index: 60; background: #0C0C0E; color: #F4F2EE;
  display: grid; grid-template-rows: auto 1fr auto; touch-action: pan-y;
}
.lb-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.lb-count { font-family: var(--f-latin); letter-spacing: .15em; font-size: var(--t-sm); padding-left: 8px; }
.lb-stage { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 0; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.lb-nav { display: flex; justify-content: center; gap: 24px; padding: 10px 0 calc(18px + env(safe-area-inset-bottom, 0px)); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: inherit;
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- location ---------- */
.venue { margin: 0; font-family: var(--f-display); font-size: 1.125rem; font-weight: 700; }
.addr { margin: 4px 0 0; color: var(--muted); font-size: var(--t-sm); }
.map-img { margin: 26px 0 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.map-img img { width: 100%; }
.map-btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.map-wrap { margin: 26px calc(-1 * var(--gutter)) 0; }  /* full width: map labels stay legible on phones */
.map-wrap .map-img { margin: 0; border: 0; border-radius: 0; border-block: 1px solid var(--line); }
.map-hint { margin: 8px 0 0; font-size: var(--t-xs); color: var(--muted); }
.map-card {
  margin: 26px 0 0; padding: 26px 18px; border: 1px solid var(--line); border-radius: 8px;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--surface);
}
.map-card .pin { width: 26px; height: 26px; margin: 0 auto 6px; color: var(--accent); }
.map-card p { margin: 0; display: inline-block; background: var(--bg); padding: 4px 12px; border-radius: 999px; font-size: var(--t-sm); }
.transport { margin: 34px 0 0; text-align: left; display: grid; gap: 0; }
.transport div { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.transport div:last-child { border-bottom: 1px solid var(--line); }
.transport dt { font-weight: 700; font-size: var(--t-sm); color: var(--accent); }
.transport dd { margin: 0; font-size: 0.9375rem; white-space: pre-line; min-width: 0; }

/* ---------- notices ---------- */
.notices { display: grid; gap: 12px; text-align: left; }
.notice { padding: 20px 20px 18px; border-radius: var(--radius); background: var(--surface); }
.notice h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 1rem; }
.notice p { margin: 0; font-size: 0.9375rem; white-space: pre-line; }

/* ---------- accounts ---------- */
.acc-intro { margin: 0 0 26px; font-size: 0.9375rem; white-space: pre-line; text-wrap: pretty; }
.acc-groups { display: grid; gap: 10px; text-align: left; }
.acc-group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.acc-group summary {
  list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; background: var(--surface);
}
.acc-group summary::-webkit-details-marker { display: none; }
.acc-group summary svg { width: 16px; height: 16px; transition: transform .25s; color: var(--muted); }
.acc-group[open] summary svg { transform: rotate(180deg); }
.acct { padding: 16px 18px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.acct-who { font-size: var(--t-sm); color: var(--muted); }
.acct-num { font-size: 1rem; font-variant-numeric: tabular-nums; }
.acct .btn-row { justify-content: flex-start; margin-top: 8px; gap: 6px; }

/* ---------- rsvp ---------- */
.rsvp-card { padding: 30px 22px; border-radius: var(--radius); background: var(--surface); }
.rsvp-card p { margin: 0; }
.deadline { margin-top: 8px !important; font-size: var(--t-sm); color: var(--muted); }

.form { display: grid; gap: 16px; text-align: left; }
.field label, .field .lab { display: block; font-size: var(--t-sm); margin-bottom: 6px; color: var(--muted); }
.field input, .field textarea, .field select {
  width: 100%; min-height: 46px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 1rem;
}
.field textarea { min-height: 84px; resize: vertical; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  margin: 0; min-height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px;
  color: var(--ink); background: var(--bg); cursor: pointer; font-size: var(--t-sm);
}
.seg input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.composed {
  margin: 0; padding: 16px; border-radius: 10px; background: var(--surface); white-space: pre-wrap;
  font-size: 0.9375rem; user-select: text; -webkit-user-select: text; text-align: left;
}
.form-error { margin: 0; color: var(--sun); font-size: var(--t-sm); }

/* ---------- closing ---------- */
.ending-photo { margin: 0 0 30px; }
.ending-photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 4px; }
.expiry-note { margin: 34px 0 0; font-size: var(--t-xs); color: var(--muted); }

/* ---------- sheet (contacts, rsvp) ---------- */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 12, .45); }
.sheet {
  position: fixed; z-index: 51; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(100%, var(--col)); max-height: 88vh; overflow-y: auto;
  background: var(--bg); color: var(--ink); border-radius: 20px 20px 0 0;
  padding: 10px var(--gutter) calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .18);
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.125rem; }
.contact-group h3 { margin: 18px 0 4px; font-size: var(--t-xs); font-family: var(--f-latin); letter-spacing: var(--latin-tracking); color: var(--accent); text-transform: uppercase; }
.contact { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.contact .who { min-width: 0; }
.contact .who small { display: block; color: var(--muted); font-size: var(--t-xs); }
.contact .who span { font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; }
.contact .btn-row { margin: 0; justify-content: flex-end; gap: 6px; }

/* ---------- toast, bgm, effects ---------- */
.toast {
  position: fixed; z-index: 70; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); padding: 10px 18px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-size: var(--t-sm); max-width: calc(100% - 40px); text-align: center;
}
.bgm {
  position: fixed; z-index: 40; top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(12px, calc((100vw - var(--col)) / 2 + 12px));
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); display: grid; place-items: center; cursor: pointer; opacity: .92;
}
.bgm svg { width: 17px; height: 17px; }
.bgm[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.fx { position: fixed; inset: 0; z-index: 30; pointer-events: none; width: 100%; height: 100%; }

/* ---------- expired ---------- */
.expired { min-height: 80vh; display: grid; place-items: center; padding: 60px var(--gutter); text-align: center; }
.expired .seal {
  width: 64px; height: 64px; margin: 0 auto 26px; border-radius: 50%; border: 1px solid var(--line);

      p.x = Math.random() * W2; p.y = top ? -20 * dpr : Math.random() * H2;
      p.r = (kind === "snow" ? 1.2 + Math.random() * 2.2 : 5 + Math.random() * 5) * dpr;
      p.vy = (kind === "snow" ? 0.35 + Math.random() * 0.5 : 0.45 + Math.random() * 0.55) * dpr;
      p.vx = (Math.random() - 0.5) * 0.4 * dpr; p.a = Math.random() * 6.28; p.va = (Math.random() - 0.5) * 0.02;
      p.o = 0.35 + Math.random() * 0.45; p.sway = Math.random() * 6.28;
      return p;
    }
    size(); addEventListener("resize", size);
    for (var i = 0; i < N; i++) P.push(spawn({}, false));
    function frame() {
      ctx.clearRect(0, 0, W2, H2);
      P.forEach(function (p) {
        p.sway += 0.012; p.x += p.vx + Math.sin(p.sway) * 0.35 * dpr; p.y += p.vy; p.a += p.va;
        if (p.y > H2 + 20 * dpr) spawn(p, true);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = p.o;
        ctx.fillStyle = "rgb(" + rgb + ")";
        ctx.beginPath();
        if (kind === "snow") ctx.arc(0, 0, p.r, 0, 6.283);
        else { ctx.ellipse(0, 0, p.r, p.r * 0.62, 0, 0, 6.283); }
        ctx.fill(); ctx.restore();
      });
      fxRaf = requestAnimationFrame(frame);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { cancelAnimationFrame(fxRaf); fxRaf = null; } else if (!fxRaf) frame();
    });
    frame();
  }

  /* ---------- expiry ---------- */
  function renderExpired() {
    clearInterval(cdTimer); if (fxRaf) cancelAnimationFrame(fxRaf);
    closeLightbox(); closeSheet();
    document.querySelectorAll(".fx, .bgm, .toast").forEach(function (n) { n.remove(); });
    if (window.__invAudio) { try { window.__invAudio.pause(); } catch (e) {} }
    var ek = kst(EXP - 60000);
    root.replaceChildren(h("div", { class: "expired" }, h("div", null,
      h("div", { class: "seal", html: ICON.envelope }),
      h("h1", { text: "열람 기간이 끝난 청첩장입니다" }),
      h("p", { text: (D.expiry.message || "보내주신 축하와 응원에 깊이 감사드립니다.") + "\n\n열람 기간은 " + ek.y + "년 " + ek.m + "월 " + ek.d + "일까지였습니다." }))));
  }

  /* ---------- boot ---------- */
  if (EXP && now() >= EXP) { renderExpired(); return; }
  order.forEach(function (key) {
    if (!R[key]) return;
    try { var el = R[key](); if (el) root.appendChild(el); }
    catch (e) { if (window.console) console.error("section " + key + " failed", e); }
  });
  mountBgm(); mountEffect();
  if (EXP) setInterval(function () { if (now() >= EXP) renderExpired(); }, 30000);
})();
</script>
